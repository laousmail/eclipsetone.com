<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https://lyrics.eclipsetone.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eclipse Lyrics · EclipseTone</title>
<meta name="description" content="Free lyrics tool by EclipseTone: time your lyrics, export subtitles and make a lyric video in your browser." />
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://lyrics.eclipsetone.com/" />
<!-- Without JavaScript, go to the address that always works -->
<meta http-equiv="refresh" content="3;url=https://laousmail.github.io/Eclipse-Lyrics/" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
@font-face{font-family:"Inter";src:url("/fonts/inter.woff2") format("woff2");font-weight:400 700;font-display:swap}
:root{--bg:#060606;--ink:#f4ece1;--mute:#bcb2a5;--red:#BE1A33;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f7f2ea;--ink:#1b140e;--mute:#584e45;--red:#A80F2C;color-scheme:light}}
*{box-sizing:border-box;margin:0}
body{min-height:100svh;display:grid;place-items:center;padding:1.5rem;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 "Inter",system-ui,sans-serif;text-align:center}
h1{font:700 clamp(2.2rem,7vw,3.6rem)/1.05 "Inter",system-ui,sans-serif;letter-spacing:-.04em;margin-bottom:.8rem}
p{color:var(--mute);margin-bottom:1.8rem}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 1.6rem;border-radius:99px;background:var(--red);color:#fff;font-weight:600;text-decoration:none}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>Eclipse Lyrics</h1>
<p>Opening the lyrics tool… Ouverture de l’outil de paroles…</p>
<a id="go" href="https://laousmail.github.io/Eclipse-Lyrics/">Open Eclipse Lyrics · Ouvrir</a>
</main>
<script src="go.js"></script>
</body>
</html>
