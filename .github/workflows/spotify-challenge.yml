name: Sync Spotify challenge

on:
  schedule:
    # Every day at 15:00 UTC
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync Laousmail releases into challenge-data.json
        run: node scripts/sync-spotify-challenge.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet challenge-data.json; then
            echo "No challenge-data changes."
            exit 0
          fi
          git config user.name "eclipse-tone-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenge-data.json
          git commit -m "chore: sync new Laousmail Spotify releases into challenge"
          git push
