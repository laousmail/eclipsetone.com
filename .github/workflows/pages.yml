name: Deploy GitHub Pages

# Publishes a filtered artifact so private/ and tooling stay off the live site.
# Repo Settings → Pages → Source must be "GitHub Actions" (not branch root).

on:
  push:
    branches:
      - main   # only main publishes the live site
  workflow_dispatch:

# Nothing by default; each job gets only what it needs
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to exact commits, so a hijacked tag can't change what runs here
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build public dist (exclude private internals)
        run: |
          mkdir -p dist
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'private/' \
            --exclude 'docs/' \
            --exclude 'src/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude '.cursor/' \
            --exclude '*.md' \
            ./ dist/
          # Keep a minimal public README pointer optional — omit internal markdown.
          # Re-add root README as optional later if desired.
          test -f dist/CNAME
          test ! -e dist/private
          test ! -e dist/docs
          test ! -e dist/src
          ls -la dist | head

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
